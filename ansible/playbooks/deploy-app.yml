---
- name: Deploy application stack with Docker Compose
  hosts: app_servers
  become: true

  vars:
    app_repo_url: "https://github.com/kapilkumaria/cloud-native-devops-platform-app.git"
    app_dir: "/opt/cloud-native-devops-platform-app"

    app_domain: "{{ ansible_host }}"
    frontend_api_url: "http://{{ ansible_host }}:8000"

    postgres_db: "app"
    postgres_user: "app"
    postgres_password: "{{ lookup('ansible.builtin.env', 'POSTGRES_PASSWORD', default=undef()) }}"

    backend_cors_origins: "http://{{ ansible_host }}:3000,http://localhost:3000"
    first_superuser: "{{ lookup('ansible.builtin.env', 'FIRST_SUPERUSER_EMAIL', default='admin@example.com') }}"
    first_superuser_password: "{{ lookup('ansible.builtin.env', 'FIRST_SUPERUSER_PASSWORD', default=undef()) }}"

    project_name: "Full Stack FastAPI Project"

  tasks:
    - name: Validate required application credentials
      ansible.builtin.assert:
        that:
          - postgres_password | length > 0
          - first_superuser_password | length > 0
        fail_msg: "Required application credentials must be supplied through environment variables."
        quiet: true
      no_log: true

    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    # The current deployment uses an unauthenticated HTTPS clone.
    # Verify repository accessibility before invoking ansible.builtin.git so
    # a private/inaccessible repository fails quickly instead of waiting for
    # interactive GitHub credentials.
    - name: Verify application repository is anonymously accessible
      ansible.builtin.command:
        cmd: git ls-remote "{{ app_repo_url }}" HEAD
      become_user: ubuntu
      environment:
        GIT_TERMINAL_PROMPT: "0"
      register: app_repo_access
      changed_when: false
      timeout: 20

    - name: Clone or update application repository
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true
      become_user: ubuntu
      environment:
        GIT_TERMINAL_PROMPT: "0"

    - name: Render backend environment file
      ansible.builtin.template:
        src: ../templates/backend.env.j2
        dest: "{{ app_dir }}/backend/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Render frontend environment file
      ansible.builtin.template:
        src: ../templates/frontend.env.j2
        dest: "{{ app_dir }}/frontend/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Start application stack
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker ps
      register: docker_ps
      changed_when: false

    - name: Print running containers
      ansible.builtin.debug:
        var: docker_ps.stdout_lines