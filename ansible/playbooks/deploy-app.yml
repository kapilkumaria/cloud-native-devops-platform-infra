---
- name: Deploy application stack with Docker Compose
  hosts: app_servers
  become: true

  vars:
    app_repo_url: "https://github.com/kapilkumaria/cloud-native-devops-platform-app.git"
    app_dir: "/opt/cloud-native-devops-platform-app"

    app_domain: "{{ ansible_host }}"
    frontend_api_url: "http://{{ ansible_host }}:8000"

    postgres_db: "app"
    postgres_user: "app"
    postgres_password: "changethis123"

    backend_cors_origins: "http://{{ ansible_host }}:3000,http://localhost:3000"
    first_superuser: "chanllenge@devopsdojo.com"
    first_superuser_password: "devopsdojo57"

    project_name: "Full Stack FastAPI Project"

  tasks:
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Clone or update application repository
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true
      become_user: ubuntu

    - name: Render backend environment file
      ansible.builtin.template:
        src: ../templates/backend.env.j2
        dest: "{{ app_dir }}/backend/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Render frontend environment file
      ansible.builtin.template:
        src: ../templates/frontend.env.j2
        dest: "{{ app_dir }}/frontend/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Start application stack
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker ps
      register: docker_ps
      changed_when: false

    - name: Print running containers
      ansible.builtin.debug:
        var: docker_ps.stdout_lines
